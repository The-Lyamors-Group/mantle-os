name: MantleOS build

on:
  push:
  pull_request:

jobs:
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install MantleOS build and boot tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc binutils make grub-efi-amd64-bin grub-pc-bin grub-common xorriso mtools qemu-system-x86 ovmf coreutils file python3

      - name: Check architecture boundary
        run: sh ./tests/check-layout.sh

      - name: Verify freestanding kernel sources
        run: sh ./tests/verify-kernel-source.sh

      - name: Build MantleOS kernel and ISO
        run: |
          set -eu
          sh ./build.sh

      - name: Verify ISO metadata and checksum
        run: sh ./tests/verify-image.sh

      - name: Verify MantleOS userspace
        run: sh ./tests/verify-userspace.sh

      - name: Boot MantleOS in QEMU UEFI
        run: sh ./tests/qemu-boot.sh

      - name: Publish validated GitHub Release
        if: success() && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_type=""
          case "$GITHUB_REF_NAME" in
            *-alpha*|*-beta*|*-rc*) release_type="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "MantleOS $GITHUB_REF_NAME" \
            $release_type \
            --notes "Build MantleOS validé par la CI : compilation, vérification SHA-256 et boot UEFI QEMU réussis." \
            build/out/mantleos-amd64.iso \
            build/out/mantleos-amd64.iso.sha256 \
            build/out/mantleos-build-info.txt

      - name: Preserve build and serial diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mantleos-diagnostics-${{ github.sha }}
          if-no-files-found: warn
          path: |
            build/out/build.log
            build/out/qemu.log
            build/out/qemu-serial.log
            build/out/mantleos-build-info.txt

      - name: Publish validated ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mantleos-amd64-${{ github.sha }}
          path: |
            build/out/mantleos-amd64.iso
            build/out/mantleos-amd64.iso.sha256
            build/out/mantleos-build-info.txt
