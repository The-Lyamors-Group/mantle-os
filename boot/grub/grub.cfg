set timeout=3
set default=0
insmod all_video
insmod gfxterm
set gfxmode=auto
terminal_output gfxterm
menuentry 'MantleOS' {
  linux /boot/vmlinuz initrd=/boot/initramfs.cpio.gz mantle.root=/dev/vda console=tty0 console=ttyS0,115200n8 loglevel=4
  initrd /boot/initramfs.cpio.gz
}
menuentry 'MantleOS — diagnostic' {
  linux /boot/vmlinuz initrd=/boot/initramfs.cpio.gz console=tty0 console=ttyS0,115200n8 loglevel=7
  initrd /boot/initramfs.cpio.gz
}
