set timeout=0
set default=0

serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1
terminal_input console serial
terminal_output console serial

insmod multiboot2

menuentry 'MantleOS' {
    multiboot2 /boot/mantle-kernel.elf
    boot
}

menuentry 'MantleOS — diagnostic' {
    multiboot2 /boot/mantle-kernel.elf
    boot
}
